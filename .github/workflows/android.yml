name: Build Stormphrax Android ARM64 NEON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "NDK_BIN=$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Download default NNUE network
        run: |
          set -euo pipefail
          make download-net
          ls -lh *.nnue

      # The network permutation tool must run on the GitHub x86_64
      # runner. It is not part of the Android engine binary.
      - name: Build host permute tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          clang++ -O2 -std=c++20 \
            -I3rdparty/fmt/include \
            -DSP_NATIVE -march=native \
            preprocess/permute.cpp \
            3rdparty/fmt/src/format.cc \
            -o tmp/permute-android-neon
          test -x tmp/permute-android-neon

      # armv8-a is the baseline AArch64 ISA and includes NEON/ASIMD.
      # Dot-product is optional and is selected automatically when the
      # compiler target provides __ARM_FEATURE_DOTPROD.
      - name: Build Stormphrax ARM64 NEON
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make android-neon \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" \
            EXE=stormphrax-android-arm64-neon \
            LDFLAGS="-static-libstdc++ -Wl,-Bstatic -lc++ -lc++abi -Wl,-Bdynamic -pthread -fuse-ld=lld"

      - name: Build Stormphrax ARM64 scalar reference
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make android-scalar \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" \
            EXE=stormphrax-android-arm64-scalar \
            LDFLAGS="-static-libstdc++ -Wl,-Bstatic -lc++ -lc++abi -Wl,-Bdynamic -pthread -fuse-ld=lld"

      - name: Verify ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail
          for binary in stormphrax-android-arm64-neon stormphrax-android-arm64-scalar; do
            test -x "$binary"
            file "$binary"
            "$NDK_BIN/llvm-readelf" -h "$binary" | grep -E 'Class:|Machine:'
          done

      # Do not execute the Android binaries on the Ubuntu x86_64 runner.
      # They are Android AArch64 ELF files and must be tested on an Android
      # device (DroidFish/Termux). The ELF checks above verify the output ABI.

      - name: Upload Android ARM64 comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stormphrax-android-arm64-neon-and-scalar
          path: |
            stormphrax-android-arm64-neon
            stormphrax-android-arm64-scalar
          if-no-files-found: error

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-neon-scalar-${{ github.run_number }}
          name: Stormphrax Android ARM64 NEON + Scalar ${{ github.run_number }}
          prerelease: true
          files: |
            stormphrax-android-arm64-neon
            stormphrax-android-arm64-scalar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
