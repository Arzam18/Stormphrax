name: Build Stormphrax Android ARM64 NEON + Scalar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "NDK_BIN=$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Download default NNUE network
        shell: bash
        run: |
          set -euo pipefail
          make download-net
          ls -lh *.nnue
          sha256sum *.nnue

      - name: Build Android ARM64 NEON
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make android-neon \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" \
            EXE=stormphrax-android-arm64-neon \
            LDFLAGS="-static-libstdc++ -pthread -fuse-ld=lld"
          test -x stormphrax-android-arm64-neon
          "$NDK_BIN/llvm-readelf" -h stormphrax-android-arm64-neon | grep -E 'Class:|Machine:'

      - name: Build Android scalar reference
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make android-scalar \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" \
            EXE=stormphrax-android-arm64-scalar \
            LDFLAGS="-static-libstdc++ -pthread -fuse-ld=lld"
          test -x stormphrax-android-arm64-scalar
          "$NDK_BIN/llvm-readelf" -h stormphrax-android-arm64-scalar | grep -E 'Class:|Machine:'

      # Do not execute either Android binary on the x86_64 GitHub runner.
      # Compare both binaries on the same Android device.
      - name: Upload Android binaries
        uses: actions/upload-artifact@v4
        with:
          name: stormphrax-android-arm64-neon-and-scalar
          path: |
            stormphrax-android-arm64-neon
            stormphrax-android-arm64-scalar
          if-no-files-found: error
