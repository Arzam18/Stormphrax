name: Build Stormphrax Android ARM64 NEON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "NDK_BIN=$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Download default NNUE network
        run: |
          set -euo pipefail
          make download-net
          ls -lh *.nnue

      # The network permutation tool must run on the GitHub x86_64
      # runner. It is not part of the Android engine binary.
      - name: Build host permute tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          clang++ -O2 -std=c++20 \
            -I3rdparty/fmt/include \
            -DSP_NATIVE -march=native \
            preprocess/permute.cpp \
            3rdparty/fmt/src/format.cc \
            -o tmp/permute-android-neon
          test -x tmp/permute-android-neon

      # armv8-a is the baseline AArch64 ISA and includes NEON/ASIMD.
      # Dot-product is optional and is selected automatically when the
      # compiler target provides __ARM_FEATURE_DOTPROD.
      - name: Build Stormphrax ARM64 NEON
        shell: bash
        run: |
          set -euo pipefail
          make android-neon \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" \
            EXE=stormphrax-android-arm64 \
            LDFLAGS="-static-libstdc++ -Wl,-Bstatic -lc++ -lc++abi -Wl,-Bdynamic -pthread -fuse-ld=lld"

      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -euo pipefail
          test -x stormphrax-android-arm64
          file stormphrax-android-arm64
          "$NDK_BIN/llvm-readelf" -h stormphrax-android-arm64 | grep -E 'Class:|Machine:'

      - name: UCI smoke test
        shell: bash
        run: |
          set -euo pipefail
          printf 'uci\nisready\nposition startpos\ngo depth 4\nquit\n' |
            timeout 30 ./stormphrax-android-arm64

      - name: Upload Android ARM64 NEON artifact
        uses: actions/upload-artifact@v4
        with:
          name: stormphrax-android-arm64-neon
          path: stormphrax-android-arm64
          if-no-files-found: error

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-neon-${{ github.run_number }}
          name: Stormphrax Android ARM64 NEON ${{ github.run_number }}
          prerelease: true
          files: stormphrax-android-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
